name: phonebox_ui
description: PhoneBoxUI
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Opt #29: Dio — persistent connection pool, auto JSON, typed errors
  dio: ^5.4.3

  # http kept for report_page.dart which makes its own raw HTTP calls
  http: ^1.2.2

  flutter_html: ^3.0.0

  # WebRTC
  flutter_webrtc: ^1.2.0

  # Socket.IO
  socket_io_client: ^2.0.0-beta.4-nullsafety.0

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # Date / formatting
  intl: ^0.19.0

  # Opt #31: shimmer — skeleton loaders (perceived latency improvement)
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true