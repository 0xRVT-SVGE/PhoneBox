name: phonebox_ui
description: PhoneBoxUI
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Opt #29: Dio — persistent connection pool, auto JSON, typed errors
  dio: ^5.4.3

  flutter_html: ^3.0.0

  # WebRTC
  flutter_webrtc: ^1.2.0

  # Socket.IO — stable release (was beta.4-nullsafety.0 from 2019 era)
  socket_io_client: ^2.0.3

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # Date / formatting
  intl: ^0.19.0

  # Opt #31: shimmer — skeleton loaders (perceived latency improvement)
  shimmer: ^3.0.0

  # Opt #33: offline-first op queue — sqflite for local SQLite persistence
  # Zero network dependency; writes to device app-data directory only.
  sqflite: ^2.3.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true