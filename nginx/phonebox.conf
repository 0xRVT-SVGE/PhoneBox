# ============================================================
# FILE: nginx/phonebox.conf
# ============================================================
# Opt #43 — PhoneBox LAN load balancer (nginx)
#
# Distributes WebSocket + HTTP traffic across multiple Flask-SocketIO
# instances on the same LAN server or multiple LAN hosts.
#
# Topology:
#   Client (kiosk / browser)
#     → nginx :80  (this config)
#       → Flask instance 1 :5001  (runs monitor + admin handlers)
#       → Flask instance 2 :5002  (API only, subscribes Redis alarms)
#       → Flask instance N :500N  (scale as needed)
#
# Requirements:
#   apt install nginx
#   nginx -t && systemctl reload nginx
#
# WebSocket sticky sessions:
#   Flask-SocketIO requires that a client's WebSocket upgrade hits
#   the same backend for the lifetime of the connection.
#   ip_hash achieves this for LAN deployments where clients have
#   stable IP addresses (e.g. fixed kiosk IPs on the same /24 subnet).
#
# ============================================================

upstream phonebox_api {
    # Sticky sessions: same client IP always hits the same backend.
    # For LAN deployments (fixed kiosk IPs) this is sufficient.
    ip_hash;

    server 127.0.0.1:5001;   # Primary — runs slot monitor + admin handlers
    server 127.0.0.1:5002;   # Secondary — API only, subscribes Redis alarms
    # Add more instances here as needed:
    # server 127.0.0.1:5003;
    # server 192.168.1.42:5001;   # Remote host on same LAN

    keepalive 64;   # Reuse connections to upstream (reduces connection overhead)
}

server {
    listen 80;
    server_name phonebox.local _;   # _ catches all names (suitable for LAN)

    # ── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options       SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection      "1; mode=block";

    # ── Gzip (complement flask-compress for LAN) ──────────────────────────────
    gzip            on;
    gzip_comp_level 4;
    gzip_types      application/json text/plain text/css application/javascript;
    gzip_min_length 256;

    # ── Request size ──────────────────────────────────────────────────────────
    client_max_body_size 10M;   # For evidence clip uploads if added later

    # ── HTTP API and REST ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://phonebox_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── WebRTC signalling ─────────────────────────────────────────────────────
    location /webrtc/ {
        proxy_pass         http://phonebox_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 30s;
    }

    # ── SocketIO (WebSocket upgrade required) ─────────────────────────────────
    # The /socket.io/ path is used by Flask-SocketIO for both polling
    # and WebSocket transports.  The Upgrade / Connection headers are
    # mandatory for WS to work through nginx.
    location /socket.io/ {
        proxy_pass         http://phonebox_api;
        proxy_http_version 1.1;

        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_read_timeout    3600s;   # Long timeout for persistent WS connections
        proxy_send_timeout    3600s;
        proxy_connect_timeout 10s;

        # Disable buffering for real-time events
        proxy_buffering    off;
        proxy_cache        off;
    }

    # ── Health check endpoint (for monitoring) ────────────────────────────────
    location /health {
        proxy_pass http://phonebox_api/api/health;
        access_log off;
    }

    # ── Evidence clips (serve directly from disk — avoids Flask overhead) ─────
    # Comment out if clips should be served through Flask for auth gating.
    location /evidence/ {
        alias          /opt/phonebox/evidence/;
        autoindex      off;
        add_header     Cache-Control "no-store";
        # Restrict to LAN subnet — adjust to match your network:
        # allow 192.168.1.0/24;
        # deny  all;
    }

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/phonebox_access.log;
    error_log  /var/log/nginx/phonebox_error.log warn;
}
